name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run build

      - name: Initialize iOS project
        run: |
          rm -rf src-tauri/gen/apple
          bunx tauri ios init --ci

      - name: Build iOS Rust static library
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release

          LIB_PATH="src-tauri/target/aarch64-apple-ios/release/libopen_grind_lib.a"
          if [ ! -f "$LIB_PATH" ]; then
            echo "iOS static library not found at $LIB_PATH"
            exit 1
          fi

          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp "$LIB_PATH" src-tauri/gen/apple/Externals/arm64/release/libapp.a

          # Keep xcodebuild happy if the generated project still references both arch outputs.
          mkdir -p src-tauri/gen/apple/Externals/x86_64/release
          cp "$LIB_PATH" src-tauri/gen/apple/Externals/x86_64/release/libapp.a

      - name: Patch Xcode project to use prebuilt Rust library
        run: |
          PBXPROJ_PATH=$(find src-tauri/gen/apple -maxdepth 3 -name project.pbxproj | head -n 1)
          if [ -z "$PBXPROJ_PATH" ]; then
            echo "project.pbxproj not found under src-tauri/gen/apple"
            exit 1
          fi

          python3 << 'PYTHON_SCRIPT'
          import re
          import sys

          pbxproj_path = "$PBXPROJ_PATH"
          
          try:
              with open(pbxproj_path, 'r') as f:
                  content = f.read()
          except Exception as e:
              print(f"Failed to read {pbxproj_path}: {e}")
              sys.exit(1)

          # Pattern to find tauri ios xcode-script section
          # Look for shellScript lines that might reference the build script
          pattern = r'(/\* tauri ios xcode-script \*/.*?shellScript = ")[^"]*(")'
          replacement = r'\1set -e\nLIB_PATH="$SRCROOT/Externals/arm64/release/libapp.a"\nif [ ! -f "$LIB_PATH" ]; then\n  echo "Missing prebuilt Rust library"\n  exit 1\nfi\n\2'

          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          if new_content == content:
              print("Pattern not found, searching for alternative...")
              # If the comment pattern isn't found, look for any shellScript after the comment marker
              if "tauri ios xcode-script" in content:
                  # Find the position of the comment
                  comment_pos = content.find("tauri ios xcode-script")
                  if comment_pos > 0:
                      # Look backwards for the start of the shell script section
                      search_start = max(0, comment_pos - 500)
                      section = content[search_start:comment_pos + 1000]
                      
                      # Find and replace the shellScript line
                      script_match = re.search(r'(shellScript = ")([^"]*)(";)', section)
                      if script_match:
                          old_script = section[:script_match.start()] + script_match.group(0) + section[script_match.end():]
                          new_script = section[:script_match.start()] + r'\1set -e\nLIB_PATH="$SRCROOT/Externals/arm64/release/libapp.a"\nif [ ! -f "$LIB_PATH" ]; then\n  echo "Missing prebuilt Rust library"\n  exit 1\nfi\n\3' + section[script_match.end():]
                          new_content = content[:search_start] + new_script.replace(old_script, new_script, 1) + content[search_start + len(new_script):]

          if new_content == content:
              print("ERROR: Could not find tauri ios xcode-script section to patch")
              sys.exit(1)

          try:
              with open(pbxproj_path, 'w') as f:
                  f.write(new_content)
          except Exception as e:
              print(f"Failed to write {pbxproj_path}: {e}")
              sys.exit(1)

          print("Successfully patched Build Rust Code script to use prebuilt libapp.a")
          PYTHON_SCRIPT

          # Validate the modified pbxproj file
          if ! plutil -lint "$PBXPROJ_PATH" >/dev/null; then
            echo "Patched project.pbxproj is invalid"
            exit 1
          fi

      - name: Build iOS app without code signing
        id: ios_app
        env:
          # Xcode 26's bundled MetalToolchain shadows the Swift back-deployment
          # compatibility libs (swiftCompatibility51/56/Concurrency), causing
          # "undefined symbol __swift_FORCE_LOAD_$_swiftCompatibility*" link
          # errors against the Rust-built libapp.a. Forcing the default
          # toolchain restores those libs. See actions/runner-images#13135.
          TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
        run: |
          IOS_PROJECT_DIR="src-tauri/gen/apple"
          WORKSPACE_PATH=$(find "$IOS_PROJECT_DIR" -maxdepth 2 -name '*.xcworkspace' | head -n 1)
          XCODEPROJ_PATH=$(find "$IOS_PROJECT_DIR" -maxdepth 2 -name '*.xcodeproj' | head -n 1)

          if [ -n "$WORKSPACE_PATH" ]; then
            PROJECT_ARGS=(-workspace "$WORKSPACE_PATH")
          elif [ -n "$XCODEPROJ_PATH" ]; then
            PROJECT_ARGS=(-project "$XCODEPROJ_PATH")
          else
            echo "No Xcode workspace/project found under $IOS_PROJECT_DIR"
            exit 1
          fi

          SCHEME=$(xcodebuild "${PROJECT_ARGS[@]}" -list \
            | awk '/Schemes:/ {flag=1; next} flag && NF {gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print}')

          IOS_SCHEME=$(printf '%s\n' "$SCHEME" | grep -Ei '(^|_|-)ios$|_iOS$|iOS' | head -n 1 || true)
          if [ -n "$IOS_SCHEME" ]; then
            SCHEME="$IOS_SCHEME"
          else
            SCHEME=$(printf '%s\n' "$SCHEME" | head -n 1)
          fi

          if [ -z "$SCHEME" ]; then
            echo "Failed to resolve iOS scheme"
            exit 1
          fi

          echo "Using iOS scheme: $SCHEME"

          DERIVED_DATA_PATH="$RUNNER_TEMP/ios-derived"
          xcodebuild "${PROJECT_ARGS[@]}" \
            -scheme "$SCHEME" \
            -configuration release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

          APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 2 -type d -name '*.app' | grep -E '/(release|Release)-iphoneos/' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No release .app artifact found in $DERIVED_DATA_PATH/Build/Products"
            exit 1
          fi

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        id: ios_ipa
        run: |
          APP_PATH='${{ steps.ios_app.outputs.app_path }}'
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Cannot package IPA; app bundle missing at $APP_PATH"
            exit 1
          fi

          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          IPA_PATH="$RUNNER_TEMP/free-grind-unsigned.ipa"

          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          (
            cd "$RUNNER_TEMP"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned iOS IPA to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: free-grind-ios-ipa
          path: ${{ steps.ios_ipa.outputs.ipa_path }}
          if-no-files-found: error
